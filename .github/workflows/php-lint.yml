name: PHP Linting

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read
  pull-requests: write

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Lint PHP Files
        shell: bash
        run: |
          set -o pipefail
          echo "Starting PHP syntax check..."
          find . -path ./vendor -prune -o -type f -name "*.php" -print0 | xargs -0 -n1 php -l | tee output.log

      - name: Run integration tests
        shell: bash
        run: |
          php tests/test-legacy-load.php
          php tests/test-pricing.php
          php tests/test-route-distance.php
          php tests/test-booking-policies.php
          php tests/test-redsys-gateway.php
          php tests/test-hardening-phase1.php
          php tests/test-outbox.php
          php tests/test-booking-drafts.php
          php tests/test-server-vehicle-quotes.php
          php tests/test-money.php
          php tests/test-authoritative-receipt.php
          php tests/test-i18n.php
          php tests/test-production-readiness.php

      - name: Check JavaScript syntax
        shell: bash
        run: |
          find . \
            -path ./node_modules -prune -o \
            -path ./vendor -prune -o \
            -type f -name "*.js" -print0 | xargs -0 -n1 node --check

      - name: Check UTF-8 corruption
        shell: bash
        run: |
          set -e

          echo "Checking UTF-8 BOM..."
          if grep -rIl $'^\xEF\xBB\xBF' \
            --include="*.php" \
            --include="*.css" \
            --include="*.js" \
            .; then
            echo "ERROR: UTF-8 BOM detected."
            exit 1
          fi

          echo "Checking mojibake..."
          if grep -rInE \
            'Ã.|Â.|â€|â†|â•|â”|ï¿|ðŸ|�' \
            --include="*.php" \
            --include="*.css" \
            --include="*.js" \
            --exclude-dir="vendor" \
            .; then
            echo "ERROR: possible UTF-8 corruption detected."
            exit 1
          fi

          echo "Encoding check passed."

      - name: Check committed credentials
        shell: bash
        run: |
          set -e
          if grep -rInE \
            'sk_live_[A-Za-z0-9]{16,}|pk_live_[A-Za-z0-9]{32,}|AIza[0-9A-Za-z_-]{20,}' \
            --exclude-dir=".git" \
            --exclude-dir="vendor" \
            .; then
            echo "ERROR: possible committed credential detected."
            exit 1
          fi

      - name: Scan Git history and changes with Gitleaks
        if: github.event_name != 'workflow_dispatch'
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # gitleaks-action scans the complete repository history for a manual
      # dispatch. This repository has documented pre-baseline findings, so a
      # manual branch validation scans the current tree while PR/push runs keep
      # using the commit-range behavior above. Live remains blocked by the
      # credential-rotation attestations in ReleaseGate.
      - name: Scan current tree with Gitleaks (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: docker://ghcr.io/gitleaks/gitleaks:v8.30.1
        with:
          args: dir --redact --no-banner /github/workspace
