name: PHP Linting

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Lint PHP Files
        shell: bash
        run: |
          set -o pipefail
          echo "Starting PHP syntax check..."
          find . -type f -name "*.php" -print0 | xargs -0 -n1 php -l | tee output.log
