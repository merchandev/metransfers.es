name: PHP Linting

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Lint PHP Files
        shell: bash
        run: |
          set -o pipefail
          echo "Starting PHP syntax check..."
          find . -type f -name "*.php" -print0 | xargs -0 -n1 php -l | tee output.log

      - name: Check UTF-8 corruption
        shell: bash
        run: |
          set -e

          echo "Checking UTF-8 BOM..."
          if grep -rIl $'^\xEF\xBB\xBF' \
            --include="*.php" \
            --include="*.css" \
            --include="*.js" \
            .; then
            echo "ERROR: UTF-8 BOM detected."
            exit 1
          fi

          echo "Checking mojibake..."
          if grep -rInE \
            'Ã|Â|â€|â†|â•|â”|ï¿|�|ðŸ' \
            --include="*.php" \
            --include="*.css" \
            --include="*.js" \
            .; then
            echo "ERROR: possible UTF-8 corruption detected."
            exit 1
          fi

          echo "Encoding check passed."
